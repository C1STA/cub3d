name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxext-dev libbsd-dev

      - name: Build
        run: make

      - name: Check command-line validation
        run: |
          test "$(./cub3D 2>&1 || true)" = "$(printf 'Error\nUsage: ./cub3D <map.cub>')"
          test "$(./cub3D invalid.txt 2>&1 || true)" = "$(printf 'Error\nInvalid file extension. Use .cub files only')"

      - name: Clean generated files
        run: make fclean
